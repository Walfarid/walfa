name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install go-task
        run: |
          sh -c "$(wget -qO- https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.53.1

      - name: Format check
        run: task fmt

      - name: Test
        run: task test
